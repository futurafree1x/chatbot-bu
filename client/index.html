<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Lets the browser paint the right background (light or dark) before the CSS loads. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Start fetching the heading font straight away rather than after the CSS is parsed. -->
    <link
      rel="preload"
      href="/fonts/shrikhand-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Talk to Jimi Hendrix</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
